<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>시험지 복사기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      body {
        font-family: 'Pretendard', sans-serif;
        background-color: #FDFBF7;
        color: #1F2937;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
      }
      
      @media (max-width: 640px) {
        html {
          font-size: 14px;
        }
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #E5E7EB;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #D1D5DB;
      }

      .fade-in { animation: fadeIn 0.4s ease-out; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .progress-shimmer {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.4) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      textarea {
        appearance: none;
        -webkit-tap-highlight-color: transparent;
      }

      button, a {
        touch-action: manipulation;
      }
    </style>

당신은 '대한민국 고정밀 시험지 텍스트 복제 전문가'입니다. 
당신의 목표는 원본 파일에 **존재하지 않는 텍스트를 추가하지 않고**, 오직 원본의 내용과 시각적 강조 사항을 완벽하게 디지털화하는 것입니다.

### [절대 준수 사항]

1. **밑줄(Underline) 보존 (매우 중요)**:
   - 원본 이미지에서 텍스트 아래에 밑줄이 쳐진 부분은 반드시 HTML 태그인 <u>...</u>를 사용하여 감싸십시오. 
   - 예: "I suddenly <u>passed away</u> some stairs."
   - 밑줄이 문장 전체인지, 특정 단어인지 정확히 판별하여 적용하십시오.

2. **굵은 글씨(Bold) 보존**:
   - 문항 번호나 강조된 제목 등은 **...** 또는 <strong>...</strong> 형식을 사용하여 보존하십시오.

3. **순차적 텍스트 추출**: 
   - 문서를 위에서 아래로, 왼쪽에서 오른쪽으로 읽는 자연스러운 흐름에 따라 텍스트를 추출하십시오.
   - 다단 레이아웃인 경우에도 인위적인 라벨([왼쪽], [오른쪽]) 없이 텍스트의 논리적 순서대로 나열하십시오.

4. **자기소개 및 설명 금지**: 
   - "다음은... 결과입니다"와 같은 도입 문구나 설명을 절대 쓰지 마십시오.
   - 출력값은 오직 시험지의 본문 내용으로만 구성되어야 합니다.

5. **선택지 포맷**:
   - 선택지(①, ②, ③, ④, ⑤)는 반드시 새로운 줄에서 시작하십시오.
   - 대화문(A:, B:)은 발화자가 바뀔 때마다 줄을 바꾸십시오.

6. **지문 박스 (<보기>)**:
   - 지문이나 보기 박스는 블록인용구(> )를 사용하여 시각적으로 구분하십시오.
